<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Admin • WebZip</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-deep: #06060f;
            --bg-card: rgba(17, 25, 40, 0.65);
            --border-light: rgba(255, 255, 255, 0.06);
            --primary: #8b5cf6;
            --secondary: #06b6d4;
            --accent: #f472b6;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --font-head: 'Space Grotesk', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
            --glass-blur: blur(16px);
            --success: #4ade80;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-body);
            font-weight: 600;
            overflow-x: hidden;
            min-height: 100vh;
            padding-top: 80px;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(139, 92, 246, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(6, 182, 212, 0.06) 0%, transparent 60%),
                linear-gradient(180deg, #06060f 0%, #0f0a1e 50%, #06060f 100%);
            background-attachment: fixed;
        }

        input, textarea { -webkit-user-select: text; -moz-user-select: text; -ms-user-select: text; user-select: text; font-weight: 500; }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--primary), var(--secondary)); border-radius: 10px; }
        * { scrollbar-width: thin; scrollbar-color: var(--primary) rgba(255,255,255,0.02); }

        .reveal-hidden {
            opacity: 0;
            transform: translateY(25px);
            transition: opacity 0.6s cubic-bezier(0.23, 1, 0.32, 1),
                        transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .reveal-hidden.revealed {
            opacity: 1;
            transform: translateY(0);
        }

        nav {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 1000px;
            padding: 10px 20px;
            background: rgba(10, 10, 20, 0.5);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-light);
            border-radius: 100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 9999;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .brand {
            font-family: var(--font-head);
            font-weight: 800;
            font-size: 1rem;
            color: #fff;
            letter-spacing: -0.3px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            text-decoration: none;
        }
        .brand span { color: var(--primary); }
        .brand i { font-size: 1.1rem; color: var(--primary); }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 600;
            transition: 0.25s ease;
        }
        .back-btn:hover { color: #fff; }

        .main-content {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 0 20px 40px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .panel {
            background: var(--bg-card);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-radius: 16px;
            border: 1px solid var(--border-light);
            padding: 20px 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            transition: border-color 0.25s ease, transform 0.25s ease;
        }
        .panel:hover {
            border-color: rgba(139,92,246,0.15);
        }

        .panel-title {
            font-family: var(--font-head);
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 700;
            opacity: 0.5;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
            white-space: nowrap;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #6d28d9);
            color: #fff;
            box-shadow: 0 4px 20px rgba(139,92,246,0.2);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(139,92,246,0.3);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.03);
            color: var(--text-muted);
            border: 1px solid var(--border-light);
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.06);
            color: #fff;
        }

        .btn-danger {
            background: linear-gradient(135deg, #dc2626, #ef4444);
            color: white;
            box-shadow: 0 4px 20px rgba(220,38,38,0.15);
        }
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(220,38,38,0.25);
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-light);
            border-radius: 10px;
            margin-bottom: 8px;
            transition: all 0.25s ease;
            flex-wrap: wrap;
            gap: 8px;
        }
        .history-item:hover {
            border-color: rgba(139,92,246,0.2);
        }
        .history-item .url {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-main);
            word-break: break-all;
            flex: 1;
            min-width: 120px;
        }
        .history-item .meta {
            display: flex;
            gap: 12px;
            font-size: 0.65rem;
            color: var(--text-muted);
            font-weight: 500;
            flex-wrap: wrap;
        }
        .history-item .meta span { opacity: 0.5; }
        .history-empty {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
            padding: 30px 0;
            opacity: 0.4;
            font-weight: 500;
        }

        .history-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }
        .history-stats .stat {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-light);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }
        .history-stats .stat .num {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
        }
        .history-stats .stat .label {
            font-size: 0.55rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.4;
            font-weight: 600;
        }

        .inbox-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .inbox-form input,
        .inbox-form textarea {
            padding: 10px 14px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-light);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.85rem;
            font-weight: 600;
            font-family: inherit;
            outline: none;
            transition: all 0.25s ease;
        }
        .inbox-form input:focus,
        .inbox-form textarea:focus {
            border-color: rgba(139,92,246,0.3);
            background: rgba(255,255,255,0.05);
        }
        .inbox-form textarea {
            resize: vertical;
            min-height: 80px;
        }
        .inbox-form input::placeholder,
        .inbox-form textarea::placeholder {
            color: var(--text-muted);
            opacity: 0.3;
            font-weight: 500;
        }

        @media (max-width: 700px) {
            body { padding-top: 70px; }
            .main-content { padding: 0 12px 30px; gap: 12px; }
            .panel { padding: 14px 16px; }
            nav { width: 96%; padding: 8px 14px; top: 10px; }
            .brand { font-size: 0.85rem; }
            .history-item { flex-direction: column; align-items: flex-start; }
            .history-item .meta { width: 100%; justify-content: flex-start; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="brand">
            <i class="fas fa-code"></i> Web<span>Zip</span> <span style="font-size:0.5rem;opacity:0.3;font-weight:400;">Admin</span>
        </a>
        <div class="nav-right">
            <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Kembali</a>
        </div>
    </nav>

    <div class="main-content">

        <!-- HISTORY -->
        <div class="panel reveal-hidden">
            <div class="panel-title"><i class="fas fa-history"></i> Riwayat Scraping</div>
            <div class="history-stats" id="historyStats">
                <div class="stat"><div class="num" id="totalScrapes">0</div><div class="label">Total Scrape</div></div>
                <div class="stat"><div class="num" id="totalFiles">0</div><div class="label">Total File</div></div>
                <div class="stat"><div class="num" id="avgSize">0 KB</div><div class="label">Rata-rata</div></div>
            </div>
            <div id="historyList"><div class="history-empty">Belum ada riwayat scraping.</div></div>
            <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;">
                <button class="btn btn-danger" id="clearHistoryBtn"><i class="fas fa-trash"></i> Hapus Semua</button>
                <button class="btn btn-secondary" id="refreshHistoryBtn"><i class="fas fa-refresh"></i> Refresh</button>
            </div>
        </div>

        <!-- KIRIM PESAN -->
        <div class="panel reveal-hidden">
            <div class="panel-title"><i class="fas fa-paper-plane"></i> Kirim Pengumuman</div>
            <div class="inbox-form">
                <input type="text" id="msgTitle" placeholder="Judul pesan..." />
                <textarea id="msgBody" placeholder="Isi pesan..."></textarea>
                <button class="btn btn-primary" id="sendMsgBtn"><i class="fas fa-paper-plane"></i> Kirim ke Inbox</button>
                <div id="sendMsgStatus" style="font-size:0.7rem;color:var(--success);display:none;">✅ Pesan terkirim!</div>
            </div>
        </div>

    </div>

    <script>
        (function() {
            'use strict';

            const historyList = document.getElementById('historyList');
            const totalScrapes = document.getElementById('totalScrapes');
            const totalFiles = document.getElementById('totalFiles');
            const avgSize = document.getElementById('avgSize');
            const clearHistoryBtn = document.getElementById('clearHistoryBtn');
            const refreshHistoryBtn = document.getElementById('refreshHistoryBtn');
            const msgTitle = document.getElementById('msgTitle');
            const msgBody = document.getElementById('msgBody');
            const sendMsgBtn = document.getElementById('sendMsgBtn');
            const sendMsgStatus = document.getElementById('sendMsgStatus');

            function loadHistory() {
                let history = [];
                try { history = JSON.parse(localStorage.getItem('webzip_history') || '[]'); } catch(e) {}

                if (history.length === 0) {
                    historyList.innerHTML = `<div class="history-empty">Belum ada riwayat scraping.</div>`;
                    totalScrapes.textContent = '0';
                    totalFiles.textContent = '0';
                    avgSize.textContent = '0 KB';
                    return;
                }

                let totalF = 0;
                let totalSize = 0;
                let sizeCount = 0;

                historyList.innerHTML = history.map((h) => {
                    const sizeMatch = h.size ? h.size.match(/([\d.]+)\s*(KB|MB)/);
                    let sizeNum = 0;
                    if (sizeMatch) {
                        sizeNum = parseFloat(sizeMatch[1]);
                        if (sizeMatch[2] === 'MB') sizeNum *= 1024;
                        totalSize += sizeNum;
                        sizeCount++;
                    }
                    totalF += h.files || 0;

                    const time = h.time ? new Date(h.time).toLocaleString('id-ID') : '-';
                    return `
                        <div class="history-item">
                            <span class="url">${escapeHtml(h.url)}</span>
                            <div class="meta">
                                <span>📄 ${h.files || 0} file</span>
                                <span>📦 ${h.size || '-'}</span>
                                <span>🕐 ${time}</span>
                            </div>
                        </div>
                    `;
                }).join('');

                totalScrapes.textContent = history.length;
                totalFiles.textContent = totalF;

                const avg = sizeCount > 0 ? Math.round(totalSize / sizeCount) : 0;
                avgSize.textContent = avg > 1024 ? (avg/1024).toFixed(1)+' MB' : avg+' KB';
            }

            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            function clearHistory() {
                if (!confirm('Hapus semua riwayat scraping?')) return;
                localStorage.removeItem('webzip_history');
                loadHistory();
            }

            function sendMessage() {
                const title = msgTitle.value.trim();
                const body = msgBody.value.trim();
                if (!title || !body) { alert('Judul dan isi pesan wajib diisi!'); return; }

                let messages = [];
                try { messages = JSON.parse(localStorage.getItem('webzip_inbox') || '[]'); } catch(e) {}

                messages.unshift({
                    title: title,
                    body: body,
                    time: new Date().toLocaleString('id-ID'),
                    read: false,
                    timestamp: Date.now()
                });

                if (messages.length > 100) messages.length = 100;
                localStorage.setItem('webzip_inbox', JSON.stringify(messages));

                msgTitle.value = '';
                msgBody.value = '';
                sendMsgStatus.style.display = 'block';
                setTimeout(() => { sendMsgStatus.style.display = 'none'; }, 3000);

                alert('✅ Pesan berhasil dikirim ke inbox!');
            }

            function initScrollReveal() {
                const els = document.querySelectorAll('.reveal-hidden');
                els.forEach(el => el.classList.remove('revealed'));

                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('revealed');
                        } else {
                            entry.target.classList.remove('revealed');
                            void entry.target.offsetWidth;
                        }
                    });
                }, {
                    threshold: 0.1,
                    rootMargin: '0px 0px -30px 0px'
                });

                els.forEach(el => observer.observe(el));
                window._scrollObserver = observer;
            }

            clearHistoryBtn.addEventListener('click', clearHistory);
            refreshHistoryBtn.addEventListener('click', loadHistory);
            sendMsgBtn.addEventListener('click', sendMessage);

            loadHistory();
            setTimeout(initScrollReveal, 300);

            console.log('🔐 Admin Panel ready.');
        })();
    </script>

</body>
</html>
