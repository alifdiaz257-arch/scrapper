<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Admin • WebZip</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-deep: #06060f;
            --bg-card: rgba(17, 25, 40, 0.65);
            --border-light: rgba(255, 255, 255, 0.06);
            --primary: #8b5cf6;
            --secondary: #06b6d4;
            --accent: #f472b6;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --font-head: 'Space Grotesk', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
            --glass-blur: blur(16px);
            --success: #4ade80;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-body);
            font-weight: 600;
            overflow-x: hidden;
            min-height: 100vh;
            padding-top: 80px;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(139, 92, 246, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(6, 182, 212, 0.06) 0%, transparent 60%),
                linear-gradient(180deg, #06060f 0%, #0f0a1e 50%, #06060f 100%);
            background-attachment: fixed;
        }

        input,
        textarea {
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
            font-weight: 500;
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--primary), var(--secondary));
            border-radius: 10px;
        }
        * {
            scrollbar-width: thin;
            scrollbar-color: var(--primary) rgba(255, 255, 255, 0.02);
        }

        .pin-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(16px);
            z-index: 999999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: pinFade 0.3s ease;
        }
        .pin-overlay.hide {
            display: none;
        }

        @keyframes pinFade {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .pin-box {
            background: rgba(12, 12, 28, 0.95);
            border: 1px solid var(--border-light);
            border-radius: 24px;
            padding: 36px 32px 28px;
            max-width: 360px;
            width: 100%;
            text-align: center;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6);
        }

        .pin-box .icon {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 12px;
        }
        .pin-box h2 {
            font-family: var(--font-head);
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--text-main);
        }
        .pin-box p {
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .pin-dots {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 16px;
        }
        .pin-dots span {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.08);
            background: transparent;
            transition: all 0.2s;
        }
        .pin-dots span.filled {
            background: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
        }

        .pin-error {
            color: var(--danger);
            font-size: 0.7rem;
            margin-bottom: 12px;
            min-height: 20px;
            opacity: 0;
            transition: 0.2s;
            font-weight: 600;
        }
        .pin-error.show {
            opacity: 1;
        }

        .pin-numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .pin-numpad button {
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-main);
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
            border: 1px solid transparent;
        }
        .pin-numpad button:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.06);
        }
        .pin-numpad button:active {
            transform: scale(0.93);
        }
        .pin-numpad button.clear-btn,
        .pin-numpad button.enter-btn {
            color: var(--text-muted);
        }

        .main-wrapper {
            display: none;
        }
        .main-wrapper.show {
            display: block;
        }

        .reveal-hidden {
            opacity: 0;
            transform: translateY(25px);
            transition: opacity 0.6s cubic-bezier(0.23, 1, 0.32, 1),
                transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .reveal-hidden.revealed {
            opacity: 1;
            transform: translateY(0);
        }

        nav {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 1000px;
            padding: 10px 20px;
            background: rgba(10, 10, 20, 0.5);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-light);
            border-radius: 100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 9999;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .brand {
            font-family: var(--font-head);
            font-weight: 800;
            font-size: 1rem;
            color: #fff;
            letter-spacing: -0.3px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            text-decoration: none;
        }
        .brand span {
            color: var(--primary);
        }
        .brand i {
            font-size: 1.1rem;
            color: var(--primary);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 600;
            transition: 0.25s ease;
        }
        .back-btn:hover {
            color: #fff;
        }

        .main-content {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 0 20px 40px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .panel {
            background: var(--bg-card);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-radius: 16px;
            border: 1px solid var(--border-light);
            padding: 20px 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            transition: border-color 0.25s ease, transform 0.25s ease;
        }
        .panel:hover {
            border-color: rgba(139, 92, 246, 0.15);
        }

        .panel-title {
            font-family: var(--font-head);
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 700;
            opacity: 0.5;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
            white-space: nowrap;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #6d28d9);
            color: #fff;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.2);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(139, 92, 246, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-muted);
            border: 1px solid var(--border-light);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }

        .btn-danger {
            background: linear-gradient(135deg, #dc2626, #ef4444);
            color: white;
            box-shadow: 0 4px 20px rgba(220, 38, 38, 0.15);
        }
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(220, 38, 38, 0.25);
        }

        .btn-success {
            background: linear-gradient(135deg, #059669, #10b981);
            color: white;
            box-shadow: 0 4px 20px rgba(5, 150, 105, 0.2);
        }
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(5, 150, 105, 0.3);
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-light);
            border-radius: 10px;
            margin-bottom: 8px;
            transition: all 0.25s ease;
            flex-wrap: wrap;
            gap: 8px;
        }
        .history-item:hover {
            border-color: rgba(139, 92, 246, 0.2);
        }
        .history-item .url {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-main);
            word-break: break-all;
            flex: 1;
            min-width: 120px;
        }
        .history-item .meta {
            display: flex;
            gap: 12px;
            font-size: 0.65rem;
            color: var(--text-muted);
            font-weight: 500;
            flex-wrap: wrap;
        }
        .history-item .meta span {
            opacity: 0.5;
        }
        .history-item .download-btn {
            padding: 4px 12px;
            border-radius: 6px;
            border: none;
            font-size: 0.6rem;
            font-weight: 700;
            cursor: pointer;
            background: rgba(74, 222, 128, 0.08);
            color: var(--success);
            border: 1px solid rgba(74, 222, 128, 0.06);
            transition: all 0.2s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .history-item .download-btn:hover {
            background: rgba(74, 222, 128, 0.16);
        }

        .history-empty {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
            padding: 30px 0;
            opacity: 0.4;
            font-weight: 500;
        }

        .history-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }
        .history-stats .stat {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-light);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }
        .history-stats .stat .num {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
        }
        .history-stats .stat .label {
            font-size: 0.55rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.4;
            font-weight: 600;
        }

        .inbox-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .inbox-form input,
        .inbox-form textarea {
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-light);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.85rem;
            font-weight: 600;
            font-family: inherit;
            outline: none;
            transition: all 0.25s ease;
        }
        .inbox-form input:focus,
        .inbox-form textarea:focus {
            border-color: rgba(139, 92, 246, 0.3);
            background: rgba(255, 255, 255, 0.05);
        }
        .inbox-form textarea {
            resize: vertical;
            min-height: 80px;
        }
        .inbox-form input::placeholder,
        .inbox-form textarea::placeholder {
            color: var(--text-muted);
            opacity: 0.3;
            font-weight: 500;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(12, 12, 28, 0.95);
            border: 1px solid var(--border-light);
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 0.8rem;
            color: var(--success);
            z-index: 99999;
            display: none;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            font-weight: 600;
        }
        .toast.show {
            display: block;
            animation: toastIn 0.3s ease;
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        @media (max-width: 700px) {
            body {
                padding-top: 70px;
            }
            .main-content {
                padding: 0 12px 30px;
                gap: 12px;
            }
            .panel {
                padding: 14px 16px;
            }
            nav {
                width: 96%;
                padding: 8px 14px;
                top: 10px;
            }
            .brand {
                font-size: 0.85rem;
            }
            .history-item {
                flex-direction: column;
                align-items: flex-start;
            }
            .history-item .meta {
                width: 100%;
                justify-content: flex-start;
            }
            .pin-box {
                padding: 28px 20px 20px;
            }
            .pin-numpad button {
                padding: 10px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== PIN OVERLAY ===== -->
    <div class="pin-overlay" id="pinOverlay">
        <div class="pin-box">
            <div class="icon"><i class="fas fa-lock"></i></div>
            <h2>Admin Access</h2>
            <p>Masukkan PIN 4 digit</p>
            <div class="pin-dots" id="pinDots">
                <span></span><span></span><span></span><span></span>
            </div>
            <div class="pin-error" id="pinError">PIN salah. Coba lagi.</div>
            <div class="pin-numpad">
                <button data-num="1">1</button>
                <button data-num="2">2</button>
                <button data-num="3">3</button>
                <button data-num="4">4</button>
                <button data-num="5">5</button>
                <button data-num="6">6</button>
                <button data-num="7">7</button>
                <button data-num="8">8</button>
                <button data-num="9">9</button>
                <button class="clear-btn" data-num="clear"><i class="fas fa-delete-left"></i></button>
                <button data-num="0">0</button>
                <button class="enter-btn" data-num="enter"><i class="fas fa-arrow-right"></i></button>
            </div>
        </div>
    </div>

    <!-- ===== NAVBAR ===== -->
    <nav>
        <a href="index.html" class="brand">
            <i class="fas fa-code"></i> Web<span>Zip</span> <span style="font-size:0.5rem;opacity:0.3;font-weight:400;">Admin</span>
        </a>
        <div class="nav-right">
            <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Kembali</a>
        </div>
    </nav>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="main-wrapper" id="mainWrapper">

        <div class="main-content">

            <!-- PANEL HISTORY -->
            <div class="panel reveal-hidden">
                <div class="panel-title"><i class="fas fa-history"></i> Riwayat Scraping</div>
                <div class="history-stats" id="historyStats">
                    <div class="stat">
                        <div class="num" id="totalScrapes">0</div>
                        <div class="label">Total Scrape</div>
                    </div>
                    <div class="stat">
                        <div class="num" id="totalFiles">0</div>
                        <div class="label">Total File</div>
                    </div>
                    <div class="stat">
                        <div class="num" id="avgSize">0 KB</div>
                        <div class="label">Rata-rata</div>
                    </div>
                </div>
                <div id="historyList"></div>
                <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;">
                    <button class="btn btn-danger" id="clearHistoryBtn"><i class="fas fa-trash"></i> Hapus Semua</button>
                    <button class="btn btn-secondary" id="refreshHistoryBtn"><i class="fas fa-refresh"></i> Refresh</button>
                </div>
            </div>

            <!-- PANEL KIRIM PESAN -->
            <div class="panel reveal-hidden">
                <div class="panel-title"><i class="fas fa-paper-plane"></i> Kirim Pengumuman</div>
                <div class="inbox-form">
                    <input type="text" id="msgTitle" placeholder="Judul pesan..." />
                    <textarea id="msgBody" placeholder="Isi pesan..."></textarea>
                    <button class="btn btn-primary" id="sendMsgBtn"><i class="fas fa-paper-plane"></i> Kirim ke Inbox</button>
                </div>
                <div id="sendMsgStatus" style="font-size:0.7rem;color:var(--success);margin-top:8px;display:none;">✅ Pesan terkirim!</div>
            </div>

        </div>

    </div>

    <div class="toast" id="toast"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js">
    </script>

    <script>
        (function() {
            'use strict';

            const PIN = '3333';

            // ===== PIN LOGIC =====
            const pinOverlay = document.getElementById('pinOverlay');
            const pinDots = document.querySelectorAll('#pinDots span');
            const pinError = document.getElementById('pinError');
            const mainWrapper = document.getElementById('mainWrapper');
            let pinValue = '';

            function updatePinDots() {
                pinDots.forEach((dot, i) => {
                    dot.classList.toggle('filled', i < pinValue.length);
                });
            }

            function checkPin() {
                if (pinValue === PIN) {
                    pinOverlay.classList.add('hide');
                    mainWrapper.classList.add('show');
                    setTimeout(initScrollReveal, 300);
                    loadHistory();
                } else {
                    pinError.classList.add('show');
                    pinValue = '';
                    updatePinDots();
                    setTimeout(() => pinError.classList.remove('show'), 2000);
                }
            }

            document.querySelectorAll('.pin-numpad button').forEach(btn => {
                btn.addEventListener('click', function() {
                    const num = this.dataset.num;
                    if (num === 'clear') {
                        pinValue = pinValue.slice(0, -1);
                        updatePinDots();
                        pinError.classList.remove('show');
                        return;
                    }
                    if (num === 'enter') {
                        if (pinValue.length === 4) checkPin();
                        return;
                    }
                    if (pinValue.length < 4 && /^[0-9]$/.test(num)) {
                        pinValue += num;
                        updatePinDots();
                        pinError.classList.remove('show');
                        if (pinValue.length === 4) {
                            setTimeout(checkPin, 300);
                        }
                    }
                });
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && pinValue.length === 4 && !pinOverlay.classList.contains('hide')) {
                    checkPin();
                }
                if (e.key === 'Backspace' && !pinOverlay.classList.contains('hide')) {
                    pinValue = pinValue.slice(0, -1);
                    updatePinDots();
                    pinError.classList.remove('show');
                }
            });

            // ===== LOAD HISTORY =====
            function loadHistory() {
                let history = [];
                try {
                    const raw = localStorage.getItem('webzip_history');
                    if (raw) {
                        history = JSON.parse(raw);
                        console.log('📊 Admin: Data history ditemukan, total:', history.length);
                    } else {
                        console.log('📊 Admin: Tidak ada data history di localStorage');
                    }
                } catch (e) {
                    console.error('❌ Admin: Gagal baca history:', e);
                }

                const list = document.getElementById('historyList');
                const totalScrapes = document.getElementById('totalScrapes');
                const totalFiles = document.getElementById('totalFiles');
                const avgSize = document.getElementById('avgSize');

                if (!history || history.length === 0) {
                    list.innerHTML = `
                        <div class="history-empty">
                            📭 Belum ada riwayat scraping.
                            <br><span style="font-size:0.6rem;opacity:0.5;">Coba scrape dulu di halaman utama</span>
                        </div>
                    `;
                    totalScrapes.textContent = '0';
                    totalFiles.textContent = '0';
                    avgSize.textContent = '0 KB';
                    return;
                }

                let totalF = 0;
                let totalSize = 0;
                let sizeCount = 0;

                list.innerHTML = history.map((h, idx) => {
                    let sizeNum = 0;
                    if (h.size) {
                        const sizeMatch = String(h.size).match(/([\d.]+)\s*(KB|MB)/);
                        if (sizeMatch) {
                            sizeNum = parseFloat(sizeMatch[1]);
                            if (sizeMatch[2] === 'MB') sizeNum *= 1024;
                            totalSize += sizeNum;
                            sizeCount++;
                        }
                    }
                    totalF += h.files || 0;

                    const time = h.time ? new Date(h.time).toLocaleString('id-ID') : '-';
                    const hasZip = h.zipData ? true : false;

                    return `
                        <div class="history-item">
                            <span class="url">${escapeHtml(h.url)}</span>
                            <div class="meta">
                                <span>📄 ${h.files || 0} file</span>
                                <span>📦 ${h.size || '-'}</span>
                                <span>🕐 ${time}</span>
                            </div>
                            ${hasZip ? `<button class="download-btn" onclick="window.downloadZip(${idx})"><i class="fas fa-download"></i> ZIP</button>` : '<span style="font-size:0.55rem;opacity:0.3;">⚠️ ZIP tidak tersedia</span>'}
                        </div>
                    `;
                }).join('');

                totalScrapes.textContent = history.length;
                totalFiles.textContent = totalF;

                const avg = sizeCount > 0 ? Math.round(totalSize / sizeCount) : 0;
                avgSize.textContent = avg > 1024 ? (avg / 1024).toFixed(1) + ' MB' : (avg || 0) + ' KB';
            }

            // ===== DOWNLOAD ZIP =====
            window.downloadZip = function(idx) {
                let history = [];
                try {
                    history = JSON.parse(localStorage.getItem('webzip_history') || '[]');
                } catch (e) {
                    showToast('❌ Gagal membaca history');
                    return;
                }

                const item = history[idx];
                if (!item) {
                    showToast('⚠️ Item tidak ditemukan.');
                    return;
                }

                if (!item.zipData) {
                    showToast('⚠️ File ZIP tidak tersedia untuk item ini.');
                    return;
                }

                try {
                    const byteCharacters = atob(item.zipData);
                    const byteNumbers = new Array(byteCharacters.length);
                    for (let i = 0; i < byteCharacters.length; i++) {
                        byteNumbers[i] = byteCharacters.charCodeAt(i);
                    }
                    const byteArray = new Uint8Array(byteNumbers);
                    const blob = new Blob([byteArray], { type: 'application/zip' });

                    const fileName = item.fileName || `webzip-${Date.now()}.zip`;
                    saveAs(blob, fileName);
                    showToast('✅ ZIP berhasil di-download!');
                } catch (e) {
                    console.error('Download error:', e);
                    showToast('❌ Gagal download ZIP: ' + e.message);
                }
            };

            // ===== CLEAR HISTORY =====
            function clearHistory() {
                if (!confirm('Hapus semua riwayat scraping?')) return;
                localStorage.removeItem('webzip_history');
                loadHistory();
                showToast('🗑️ Riwayat berhasil dihapus!');
            }

            // ===== SEND MESSAGE =====
            function sendMessage() {
                const title = document.getElementById('msgTitle').value.trim();
                const body = document.getElementById('msgBody').value.trim();
                if (!title || !body) {
                    showToast('⚠️ Judul dan isi pesan wajib diisi!');
                    return;
                }

                let messages = [];
                try {
                    messages = JSON.parse(localStorage.getItem('webzip_inbox') || '[]');
                } catch (e) {}

                messages.unshift({
                    title: title,
                    body: body,
                    time: new Date().toLocaleString('id-ID'),
                    read: false,
                    timestamp: Date.now()
                });

                if (messages.length > 100) messages.length = 100;
                localStorage.setItem('webzip_inbox', JSON.stringify(messages));

                document.getElementById('msgTitle').value = '';
                document.getElementById('msgBody').value = '';
                document.getElementById('sendMsgStatus').style.display = 'block';
                setTimeout(() => {
                    document.getElementById('sendMsgStatus').style.display = 'none';
                }, 3000);

                showToast('✅ Pesan berhasil dikirim ke inbox!');
            }

            // ===== TOAST =====
            function showToast(msg) {
                const toast = document.getElementById('toast');
                toast.textContent = msg;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 3000);
            }

            // ===== ESCAPE HTML =====
            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            // ===== SCROLL REVEAL =====
            function initScrollReveal() {
                const els = document.querySelectorAll('.reveal-hidden');
                els.forEach(el => el.classList.remove('revealed'));

                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('revealed');
                        } else {
                            entry.target.classList.remove('revealed');
                            void entry.target.offsetWidth;
                        }
                    });
                }, {
                    threshold: 0.1,
                    rootMargin: '0px 0px -30px 0px'
                });

                els.forEach(el => observer.observe(el));
                window._scrollObserver = observer;
            }

            // ===== EVENT LISTENERS =====
            document.getElementById('clearHistoryBtn').addEventListener('click', clearHistory);
            document.getElementById('refreshHistoryBtn').addEventListener('click', function() {
                loadHistory();
                showToast('🔄 Riwayat di-refresh!');
            });
            document.getElementById('sendMsgBtn').addEventListener('click', sendMessage);

            console.log('🔐 Admin Panel ready. PIN: 3333');
            console.log('💡 Tips: Buka scraper.html, scrape website, lalu refresh admin.html');

            // AUTO CHECK: Cek apakah ada data history saat halaman dimuat
            setTimeout(() => {
                const raw = localStorage.getItem('webzip_history');
                if (raw) {
                    try {
                        const data = JSON.parse(raw);
                        console.log('✅ Auto-check Admin: Ada', data.length, 'data history!');
                    } catch (e) {
                        console.log('⚠️ Data history ada tapi formatnya rusak');
                    }
                } else {
                    console.log('ℹ️ Belum ada data history di localStorage');
                }
            }, 1000);
        })();
    </script>
